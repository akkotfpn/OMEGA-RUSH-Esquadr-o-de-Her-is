name: APK Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Instalar dependências
        run: npm install --no-audit --no-fund

      - name: Testes
        run: npm run testar

      - name: Build web (Vite)
        run: npm run build

      - name: Criar projeto Android (Capacitor)
        run: |
          npx cap add android
          # Jogo em modo retrato e tela cheia
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/<activity/<activity android:screenOrientation="portrait"/' "$MANIFEST"
          npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../omega-rush-debug.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: omega-rush-apk
          path: omega-rush-debug.apk

      - name: Publicar Release (somente em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" omega-rush-debug.apk \
            --title "Omega Rush ${GITHUB_REF_NAME}" --generate-notes
